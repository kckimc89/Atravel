der:1px solid #dce7e9;border-radius:18px;padding:19px;margin:14px 0}.muted{color:#647a86}.photoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}.photo{border:1px solid #d9e7ec;border-radius:12px;overflow:hidden;background:#f1f5f7}.photo figure{margin:0;height:120px;display:flex;align-items:center;justify-content:center;background:#e7eff1;color:#8ba2a8;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo .phtext{font-size:13px;color:#a2abb1}.photo .metadata{padding:8px;font-size:12px}.photo button{font-size:11px;padding:7px 9px}.actions{display:flex;gap:6px;flex-wrap:wrap}.stat{display:flex;gap:10px;flex-wrap:wrap}.stat>span{background:#eaf4f5;border-radius:10px;padding:10px;font-size:13px}.back{margin-bottom:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:5px;font-size:13px}.note{background:#f1f7e8;padding:13px;border-left:4px solid #83ab3e;border-radius:10px;color:#4e6236}.hidden{display:none!important}.empty{text-align:center;padding:28px;color:#70848c}.badge{font-size:12px;color:#17576c;background:#e9f3f5;padding:5px 9px;border-radius:90px}.modal{position:fixed;inset:0;background:#0b243dd9;z-index:10;display:flex;align-items:center;justify-content:center;padding:12px}.dialog{background:white;border-radius:18px;max-width:740px;width:100%;max-height:90vh;overflow:auto;padding:18px}.fullPhoto{width:100%;max-height:64vh;object-fit:contain;background:#193341;border-radius:12px}.sr-only{position:absolute;left:-9999px}a{color:#176984}code{overflow-wrap:anywhere}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#173b4a;color:white;padding:12px 20px;border-radius:99px;display:none;z-index:30;box-shadow:0 3px 18px #0003;max-width:90vw;text-align:center}@media(max-width:600px){h1{font-size:17px}.hero h2{font-size:24px}.two{grid-template-columns:1fr}.photoGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cover{height:100px}.cardBody{padding:11px}.card h3{font-size:15px}.card p{font-size:12px}.panel{padding:14px}}
</style></head><body><header><div class="top"><div><h1>🌏 세계 여행대백과 <small>MASTER V1.1</small></h1><small>보고, 배우고, 직접 떠나는 세계 여행</small></div><button class="ghost" onclick="go('settings')">⚙️ 관리·백업</button></div></header><main id="app"></main><div id="toast" role="status"></div><input class="sr-only" type="file" id="photoUpload" accept="image/*" multiple><input class="sr-only" type="file" id="backupUpload" accept="application/json,.json"><div id="overlay"></div><script>
'use strict';
const VERSION='V1.1', STORE='travel-master-v1-data', DB='travel-master-v1-images', ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const korea=[
['gyeongbok','경복궁','서울','조선의 법궁으로, 근정전과 경회루 등 조선 궁궐의 건축을 만날 수 있어요.','1395년 태조 때 세워졌어요. 왕이 나라의 큰 행사를 열던 근정전과 연못 위 경회루가 유명합니다.','지하철 3호선 경복궁역에서 도보 약 5~10분','서울 도심에 있어 대중교통이 편리해요.','🏯'],
['changdeok','창덕궁','서울','자연 지형과 어우러진 조선 궁궐이며 유네스코 세계유산이에요.','인정전과 후원은 궁궐의 건축과 정원 문화를 보여줍니다. 후원 관람은 별도 운영 방식을 확인하세요.','광화문·서울역 기준 대중교통 약 20~40분','후원 운영시간과 예약 정보를 확인하세요.','🌿'],
['namsan','N서울타워','서울','남산 정상에 자리해 서울 시내를 넓게 내려다볼 수 있는 전망 명소예요.','서울의 모습을 한눈에 살펴보고 밤에는 도심의 불빛을 즐길 수 있어요.','광화문 기준 버스·도보 등 약 30~60분','남산의 교통수단과 운영시간은 방문 전 확인하세요.','🗼'],
['bukchon','북촌한옥마을','서울','경복궁과 창덕궁 사이에 남아 있는 한옥 골목이에요.','오래된 한옥과 현대 도시가 함께 있는 특별한 풍경을 볼 수 있어요. 실제 주민들이 생활하는 동네예요.','광화문 기준 대중교통·도보 약 15~35분','거주 지역이므로 조용히 걷고 방문 제한 시간에 유의하세요.','🏘️'],
['suwon','수원 화성','수원','정조가 건설한 성곽 도시로 유네스코 세계유산이에요.','18세기 말에 쌓은 성곽으로, 장안문·화홍문·방화수류정 등이 유명해요.','서울 시청 기준 대중교통·도보 약 70~110분','구간에 따라 걷는 거리가 길 수 있어요.','🏰'],
['seorak','설악산 국립공원','속초·인제·양양','높은 봉우리와 아름다운 계곡으로 이름난 한국의 산악 국립공원이에요.','울산바위와 비선대 등 다양한 자연 경관이 있어요. 계절마다 풍경이 달라집니다.','서울 기준 차량 약 2시간 30분~4시간 30분','날씨와 등산로 통제 여부를 확인하세요.','⛰️'],
['bulguk','불국사','경주','신라 시대 불교문화를 보여 주는 사찰로 유네스코 세계유산에 포함되어 있어요.','다보탑·석가탑과 아름다운 돌계단 등 신라의 뛰어난 건축을 살펴볼 수 있어요.','서울 기준 KTX·버스·택시 환승 약 3~4시간 30분','경주 시내 이동과 관람시간을 미리 계획하세요.','🪷'],
['cheomseong','첨성대','경주','신라 시대의 천문 관측 관련 석조 건축물이에요.','동아시아에서 오래된 천문 관련 건축물 가운데 하나로 알려져 있어요.','서울 기준 KTX·현지 이동 약 3~4시간','동궁과 월지 등 가까운 유적과 함께 둘러보세요.','🔭'],
['haeundae','해운대 해수욕장','부산','넓은 모래사장과 도시 풍경이 어우러지는 부산의 해변이에요.','부산을 대표하는 바닷가 가운데 하나이며 주변에 산책로와 관광시설이 있어요.','서울 기준 KTX·지하철 약 3시간 30분~4시간 30분','여름에는 혼잡할 수 있어요.','🏖️'],
['gamcheon','감천문화마을','부산','언덕길의 다채로운 집과 골목이 이어지는 마을이에요.','골목길의 벽화와 예술작품을 둘러보며 마을의 역사와 모습을 이해할 수 있어요.','서울 기준 KTX·부산 시내 이동 약 4~5시간','주민 생활 공간이므로 사생활을 존중하세요.','🎨'],
['seongsan','성산일출봉','제주','바다에서 솟은 화산지형으로 제주 화산섬의 일부가 세계유산에 포함되어 있어요.','바닷속 화산 활동으로 만들어진 응회구로 정상에서 바다와 제주의 풍경을 볼 수 있어요.','서울(김포)→제주 항공 약 1시간 10분, 공항에서 차량 약 1~1시간 30분','계단이 많고 날씨에 따라 관람에 제약이 생길 수 있어요.','🌋'],
['hallasan','한라산 국립공원','제주','제주도 중심에 솟은 대한민국에서 가장 높은 산이에요.','백록담과 다양한 고산 식생을 볼 수 있어요. 탐방 코스에 따라 예약이 필요할 수 있습니다.','서울(김포)→제주 항공 약 1시간 10분, 탐방로 입구까지 차량 약 40~80분','탐방 예약과 입산·하산 제한시간을 반드시 확인하세요.','🌲']];
const initial=()=>({countries:[{id:'kr',name:'대한민국',capital:'서울',emoji:'🇰🇷',intro:'한반도에 위치한 나라로, 오랜 역사와 아름다운 자연, 다양한 도시를 만날 수 있어요.',fromKorea:'출발 국가 (대한민국)',sights:korea.map(([id,name,city,summary,story,route,tip,emoji])=>({id,name,city,summary,story,route,tip,emoji,photos:[],memo:''}))}],created:Date.now()});
let data;try{data=JSON.parse(localStorage.getItem(STORE))||initial()}catch{data=initial()};if(!Array.isArray(data.countries))data=initial();let page='home',selectedCountry='kr',selectedSight=null, candidates=[], searchBusy=false;
const save=()=>localStorage.setItem(STORE,JSON.stringify(data));const country=()=>data.countries.find(x=>x.id===selectedCountry);const sight=()=>country()?.sights.find(x=>x.id===selectedSight);const uid=()=>Math.random().toString(36).slice(2,10);function msg(s){let e=document.getElementById('toast');e.textContent=s;e.style.display='block';clearTimeout(msg.timer);msg.timer=setTimeout(()=>e.style.display='none',2800)};
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function imgSet(k,v){let d=await db();return new Promise((ok,no)=>{let tx=d.transaction('photos','readwrite');tx.objectStore('photos').put(v,k);tx.oncomplete=()=>{d.close();ok()};tx.onerror=()=>no(tx.error)})}async function imgGet(k){let d=await db();return new Promise((ok,no)=>{let r=d.transaction('photos').objectStore('photos').get(k);r.onsuccess=()=>{d.close();ok(r.result)};r.onerror=()=>no(r.error)})}async function imgDel(k){let d=await db();return new Promise((ok,no)=>{let tx=d.transaction('photos','readwrite');tx.objectStore('photos').delete(k);tx.oncomplete=()=>{d.close();ok()};tx.onerror=()=>no(tx.error)})}
function go(p){page=p;candidates=[];render();window.scrollTo(0,0)};function enterCountry(id){selectedCountry=id;go('country')};function enterSight(id){selectedSight=id;go('sight')};function cover(p){let first=p.photos[0];return first?`<img loading="lazy" data-img="${ESC(first.key)}" alt="${ESC(p.name)}">`:ESC(p.emoji||'🗺️')};function back(p){return `<button class="secondary back" onclick="go('${p}')">← 돌아가기</button>`};
function home(){return `<div class="hero"><div class="pill">🌏 나만의 세계 여행</div><h2>오늘은 어느 나라로 떠나볼까요?</h2><p>나라를 선택하고 아름다운 명소의 이야기와 사진을 살펴보세요. 방문 경로도 배우고 나만의 여행 사진을 저장할 수 있어요.</p><div class="stat"><span>나라 ${data.countries.length}개</span><span>명소 ${data.countries.reduce((n,c)=>n+c.sights.length,0)}개</span></div></div><div class="note" style="margin-bottom:12px">📲 사파리에서 만든 자료를 홈 화면 앱으로 옮기려면 <b>관리·백업 → 파일로 저장 → 앱에서 자료 합치기</b>를 이용하세요.</div><div class="buttonRow"><button onclick="addCountry()">＋ 나라 추가</button><button class="secondary" onclick="go('settings')">💾 백업·복원</button></div><input id="searchCountries" placeholder="나라 검색" oninput="filterCountries(this.value)"><div id="countries" class="grid" style="margin-top:14px">${countryCards(data.countries)}</div>`};
function countryCards(cs){return cs.map(c=>`<article class="card"><div class="cover">${c.emoji||'🌍'}</div><div class="cardBody"><h3>${ESC(c.name)}</h3><p>수도 ${ESC(c.capital)} · 명소 ${c.sights.length}곳</p><button onclick="enterCountry('${c.id}')">여행 시작 →</button></div></article>`).join('')||'<div class="empty">검색 결과가 없어요.</div>'}function filterCountries(q){document.getElementById('countries').innerHTML=countryCards(data.countries.filter(c=>c.name.includes(q)||c.capital.includes(q)))}
function countryPage(){let c=country();if(!c)return home();return `${back('home')}<div class="hero"><h2>${c.emoji||'🌍'} ${ESC(c.name)} 여행</h2><p>${ESC(c.intro)}</p><div class="stat"><span>수도 ${ESC(c.capital)}</span><span>명소 ${c.sights.length}곳</span></div></div><div class="buttonRow"><button onclick="addSight()">＋ 명소 추가</button><button class="secondary" onclick="editCountry()">나라 정보 수정</button><button class="secondary" onclick="exportBackup('${c.id}')">이 나라 백업</button></div><div class="grid">${c.sights.map(s=>`<article class="card"><div class="cover">${cover(s)}</div><div class="cardBody"><h3>${ESC(s.name)}</h3><span class="badge">📍 ${ESC(s.city)}</span><p>${ESC(s.summary)}</p><p>📸 사진 ${s.photos.length}/10장</p><button onclick="enterSight('${s.id}')">명소 살펴보기 →</button></div></article>`).join('')||'<div class="empty">명소를 추가해 주세요.</div>'}</div>`}
function sightPage(){let s=sight(),c=country();if(!s)return countryPage();return `${back('country')}<div class="hero"><small>${ESC(c.name)} · ${ESC(s.city)}</small><h2>${ESC(s.emoji||'📍')} ${ESC(s.name)}</h2><p>${ESC(s.summary)}</p><span class="pill">📷 내 사진 ${s.photos.length}/10장</span></div><section class="panel"><h3>📖 명소 이야기</h3><p style="line-height:1.8">${ESC(s.story||s.summary)}</p></section><section class="panel"><h3>🧭 가는 길</h3><p><strong>출발지:</strong> ${ESC(c.capital)} (수도 기준)</p><p><strong>이동 경로와 예상시간:</strong> ${ESC(s.route||'아직 등록되지 않았어요.')}</p><p class="sub">표기된 소요시간은 일반적인 참고 범위로, 출발 지점·교통 상황·운항 및 환승에 따라 달라져요. 실제 방문 전 확인하세요.</p>${c.id!=='kr'?`<p><strong>대한민국에서 가는 길:</strong> ${ESC(c.fromKorea||'등록 전')}</p>`:''}<p class="note">${ESC(s.tip||'방문 전 운영 정보와 날씨를 확인하세요.')}</p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.name+' '+c.name)}">🗺️ 지도에서 위치 확인 ↗</a></section><section class="panel"><h3>📷 사진 여행 <span class="sub">${s.photos.length}/10장</span></h3><p class="sub">직접 찍은 사진을 추가하거나 공개 사진을 찾아 확인한 뒤 저장할 수 있어요. 사진을 누르면 크게 볼 수 있습니다.</p><div class="buttonRow"><button onclick="choosePhotos()" ${s.photos.length>=10?'disabled':''}>＋ 내 사진 등록</button><button class="secondary" onclick="searchCommons()" ${s.photos.length>=10?'disabled':''}>🔎 공개 사진 후보 찾기</button></div><div id="photoGrid" class="photoGrid">${s.photos.map((p,i)=>`<div class="photo"><figure onclick="showPhoto(${i})" style="cursor:pointer"><img data-img="${ESC(p.key)}" alt="${ESC(p.caption||s.name)}"></figure><div class="metadata"><div>${i+1}. ${ESC(p.caption||'내 사진')}</div><div class="actions"><button class="secondary" onclick="editCaption(${i})">설명</button><button class="danger" onclick="deletePhoto(${i})">삭제</button></div></div></div>`).join('')}${Array.from({length:10-s.photos.length},(_,i)=>`<div class="photo"><figure><span class="phtext">${s.photos.length+i+1}번 사진 자리</span></figure></div>`).join('')}</div><div id="candidateArea"></div></section><section class="panel"><h3>✍️ 나의 여행 기록</h3><textarea id="memo" placeholder="가보고 싶은 이유나 다녀온 여행의 추억을 적어 보세요.">${ESC(s.memo||'')}</textarea><div class="buttonRow"><button onclick="saveMemo()">기록 저장</button><button class="secondary" onclick="editSight()">명소 설명·경로 수정</button><button class="danger" onclick="removeSight()">명소 삭제</button></div></section>`}
function settings(){return `${back('home')}<h2>⚙️ 관리·백업</h2><div class="panel"><h3>📲 사파리 → 홈 화면 앱으로 옮기기</h3><p><strong>① 사파리에서</strong> 작업한 자료를 백업 파일로 저장합니다. <strong>② 홈 화면 앱에서</strong> 아래의 <b>백업 파일 선택·자료 합치기</b>를 눌러 그 파일을 선택하세요.</p><p class="note">아이패드의 사파리와 홈 화면 앱은 저장공간이 분리될 수 있어 홈 화면 추가만으로 자료가 자동 이전되지는 않습니다. 최초 1회 파일을 옮긴 뒤에는 앱에서 작업한 내용이 앱에 계속 누적 저장됩니다.</p><h3>💾 자료 내보내기</h3><label class="field"><input type="checkbox" id="allCountries" onchange="document.querySelectorAll('.ckCountry').forEach(e=>e.checked=this.checked)"> 전체 나라 선택</label><div>${data.countries.map(c=>`<label style="display:block;padding:9px"><input class="ckCountry" type="checkbox" value="${c.id}" checked style="width:auto"> ${ESC(c.emoji)} ${ESC(c.name)} (${c.sights.length}명소)</label>`).join('')}</div><div class="buttonRow"><button onclick="exportSelected()">선택한 나라 파일로 저장</button></div><p class="sub">설명·여행 기록·등록한 사진까지 함께 저장합니다. 파일 앱의 다운로드 폴더에서 찾을 수 있습니다.</p></div><div class="panel"><h3>♻️ 자료 합치기·복원</h3><p>같은 나라가 이미 있으면 명소·사진·여행 기록을 합칩니다. 다른 나라는 추가됩니다. 기존 사진·메모를 자동 삭제하지 않습니다.</p><button onclick="document.getElementById('backupUpload').click()">백업 파일 선택·자료 합치기</button><p class="sub">복원 전 현재 앱 자료를 별도로 백업해 두면 더욱 안전합니다. 사진은 명소당 최대 10장입니다.</p></div><div class="panel"><h3>🛡️ 데이터와 버전</h3><p><strong>세계 여행대백과 — MASTER ${VERSION}</strong></p><p class="sub">기존 명소대백과와 독립된 저장공간을 사용합니다. 앱에서 작업한 내용은 다시 열어도 남지만, 앱 삭제·브라우저 데이터 삭제 시 사라질 수 있으므로 정기적으로 백업하세요.</p><button class="danger" onclick="resetAll()">모든 여행 자료 초기화</button></div>`}
function render(){document.getElementById('app').innerHTML=page==='home'?home():page==='country'?countryPage():page==='sight'?sightPage():settings();hydrateImages()};async function hydrateImages(){let a=[...document.querySelectorAll('[data-img]')];for(let el of a){try{let v=await imgGet(el.dataset.img);if(v)el.src=v;else el.style.display='none'}catch{el.style.display='none'}}}
function popup(inner){document.getElementById('overlay').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="dialog">${inner}<div class="buttonRow"><button class="secondary" onclick="closePopup()">닫기</button></div></div></div>`}function closePopup(){document.getElementById('overlay').innerHTML=''}
function addCountry(){popup(`<h2>나라 추가</h2>${formField('cn','나라 이름','예: 일본')}${formField('cc','수도','예: 도쿄')}${formField('ce','나라 표시','예: 🇯🇵')}${formField('ci','나라 소개','','textarea')}${formField('ck','한국에서 가는 방법','예: 인천→도쿄 직항 항공편 약 2시간') }<button onclick="saveCountry(false)">나라 추가하기</button>`)}function editCountry(){let c=country();popup(`<h2>나라 정보 수정</h2>${formField('cn','나라 이름',c.name)}${formField('cc','수도',c.capital)}${formField('ce','나라 표시',c.emoji)}${formField('ci','나라 소개',c.intro,'textarea')}${formField('ck','한국에서 가는 방법',c.fromKorea)}<button onclick="saveCountry(true)">수정 저장</button> <button class="danger" onclick="removeCountry()">나라 삭제</button>`)}function formField(id,label,val='',type='text'){return `<div class="field"><label for="${id}">${label}</label>${type==='textarea'?`<textarea id="${id}">${ESC(val)}</textarea>`:`<input id="${id}" value="${ESC(val)}">`}</div>`}function val(id){return document.getElementById(id)?.value.trim()||''}function saveCountry(edit){if(!val('cn')||!val('cc'))return msg('나라 이름과 수도를 입력하세요.');if(edit){Object.assign(country(),{name:val('cn'),capital:val('cc'),emoji:val('ce'),intro:val('ci'),fromKorea:val('ck')})}else{let id=uid();data.countries.push({id,name:val('cn'),capital:val('cc'),emoji:val('ce'),intro:val('ci'),fromKorea:val('ck'),sights:[]});selectedCountry=id;page='country'}save();closePopup();render();msg('저장했습니다.')}
function sightForm(s){return `${formField('sn','명소 이름',s?.name)}${formField('sc','도시·지역',s?.city)}${formField('se','그림 문자',s?.emoji||'📍')}${formField('ss','짧은 소개',s?.summary,'textarea')}${formField('st','명소 이야기',s?.story,'textarea')}${formField('sr','수도에서 출발하는 경로와 예상시간',s?.route,'textarea')}${formField('sp','여행 팁',s?.tip,'textarea')}`}function addSight(){popup(`<h2>명소 추가</h2>${sightForm()}<button onclick="saveSight(false)">명소 추가하기</button>`)}function editSight(){popup(`<h2>명소 정보 수정</h2>${sightForm(sight())}<button onclick="saveSight(true)">수정 저장</button>`)}function saveSight(edit){if(!val('sn'))return msg('명소 이름을 입력하세요.');let o={name:val('sn'),city:val('sc'),emoji:val('se'),summary:val('ss'),story:val('st'),route:val('sr'),tip:val('sp')};if(edit)Object.assign(sight(),o);else{selectedSight=uid();country().sights.push({...o,id:selectedSight,photos:[],memo:''});page='sight'}save();closePopup();render();msg('저장했습니다.')}
function saveMemo(){sight().memo=val('memo');save();msg('여행 기록을 저장했어요.')}function removeSight(){if(!confirm('이 명소와 저장된 사진을 정말 삭제할까요?'))return;let s=sight();Promise.all(s.photos.map(p=>imgDel(p.key))).then(()=>{country().sights=country().sights.filter(x=>x.id!==s.id);save();go('country')}).catch(e=>msg('삭제 실패: '+e.message))}async function removeCountry(){if(!confirm('이 나라와 모든 명소·사진을 삭제할까요?'))return;let c=country();for(let s of c.sights)for(let p of s.photos)await imgDel(p.key);data.countries=data.countries.filter(x=>x.id!==c.id);save();closePopup();go('home')}
function choosePhotos(){document.getElementById('photoUpload').value='';document.getElementById('photoUpload').click()}document.getElementById('photoUpload').onchange=async e=>{let files=[...e.target.files];for(let f of files.slice(0,10-sight().photos.length)){try{let b=await compress(f);let key='p_'+uid();await imgSet(key,b);sight().photos.push({key,caption:f.name.replace(/\.[^.]+$/,'').slice(0,80),credit:'직접 등록'});save()}catch(err){msg('사진 저장 실패: '+err.message);break}}render();msg('사진 등록 완료')};function compress(file){return new Promise((ok,no)=>{let r=new FileReader();r.onerror=()=>no(Error('파일 읽기 실패'));r.onload=()=>{let image=new Image();image.onerror=()=>no(Error('이미지 열기 실패'));image.onload=()=>{let cv=document.createElement('canvas'),scale=Math.min(1,1200/Math.max(image.width,image.height));cv.width=Math.round(image.width*scale);cv.height=Math.round(image.height*scale);cv.getContext('2d').drawImage(image,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',.78))};image.src=r.result};r.readAsDataURL(file)})}
async function showPhoto(i){let p=sight().photos[i];let img=await imgGet(p.key);popup(`<h2>${ESC(sight().name)} · 사진 ${i+1}</h2><img class="fullPhoto" src="${img}" alt="${ESC(p.caption)}"><p>${ESC(p.caption)}</p><p class="sub">${ESC(p.credit||'')}</p>`)}function editCaption(i){let p=sight().photos[i],txt=prompt('사진 설명',p.caption);if(txt!==null){p.caption=txt.slice(0,180);save();render()}}async function deletePhoto(i){if(!confirm('이 사진을 삭제할까요?'))return;let p=sight().photos[i];await imgDel(p.key);sight().photos.splice(i,1);save();render()}
async function searchCommons(){if(searchBusy)return;searchBusy=true;let area=document.getElementById('candidateArea');area.innerHTML='<p>공개 사진 후보를 검색하고 있습니다…</p>';try{const term=sight().name+' '+sight().city;let u='https://commons.wikimedia.org/w/api.php?'+new URLSearchParams({action:'query',format:'json',origin:'*',generator:'search',gsrsearch:'filetype:bitmap '+term,gsrnamespace:'6',gsrlimit:'24',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'360'});let r=await fetch(u);if(!r.ok)throw Error('검색 서비스 연결 실패');let j=await r.json();candidates=Object.values(j.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.thumburl&& /\.(jpe?g|png|webp)$/i.test(x.title)).slice(0,20);area.innerHTML=`<h3>공개 사진 후보 (${candidates.length})</h3><p class="sub">검색 결과에는 다른 장소 사진이 섞일 수 있습니다. 직접 확인한 사진만 저장하세요. Wikimedia Commons 원본의 저작권·라이선스 조건을 확인해야 합니다.</p><div class="photoGrid">${candidates.map((a,i)=>`<div class="photo"><figure><img loading="lazy" src="${ESC(a.imageinfo[0].thumburl)}" alt="사진 후보"></figure><div class="metadata"><div style="overflow-wrap:anywhere">${ESC(a.title.replace('File:','').slice(0,55))}</div><button onclick="importCandidate(${i})">확인 후 저장</button> <a href="${ESC(a.imageinfo[0].descriptionurl||a.imageinfo[0].url)}" target="_blank" rel="noopener">출처·권리 ↗</a></div></div>`).join('')}</div>`}catch(err){area.innerHTML=`<p class="muted">사진 검색에 연결하지 못했습니다. 내 사진 등록 기능은 계속 사용할 수 있어요.</p><a target="_blank" rel="noopener" href="https://commons.wikimedia.org/w/index.php?search=${encodeURIComponent(sight().name)}&title=Special:MediaSearch&type=image">Wikimedia Commons에서 직접 검색 ↗</a>`}finally{searchBusy=false}}
async function importCandidate(i){if(sight().photos.length>=10)return msg('사진은 10장까지 저장할 수 있어요.');let c=candidates[i];if(!c)return;if(!confirm('선택한 이미지가 정확한 명소의 사진이고 이용 조건도 확인했나요?'))return;try{let url=c.imageinfo[0].thumburl;let res=await fetch(url);if(!res.ok)throw Error('사진 다운로드 불가');let b=await compress(await res.blob());let key='p_'+uid();await imgSet(key,b);sight().photos.push({key,caption:c.title.replace('File:','').slice(0,100),credit:'Wikimedia Commons · '+(c.imageinfo[0].descriptionurl||url)});save();render();msg('사진을 저장했습니다.') }catch(err){msg('저장 실패: 직접 사진을 등록해 주세요.')}}
async function exportBackup(id){await createBackup(id?[id]:data.countries.map(c=>c.id))}async function exportSelected(){let ids=[...document.querySelectorAll('.ckCountry:checked')].map(e=>e.value);if(!ids.length)return msg('나라를 한 곳 이상 선택해 주세요.');await createBackup(ids)}async function createBackup(ids){try{msg('백업 파일을 준비하고 있어요.');let countries=JSON.parse(JSON.stringify(data.countries.filter(c=>ids.includes(c.id))));let images={};for(let c of countries)for(let s of c.sights)for(let p of s.photos){let b=await imgGet(p.key);if(b)images[p.key]=b};let backup={format:'world-travel-master-backup',schema:1,version:VERSION,exportedAt:new Date().toISOString(),countries,images};let blob=new Blob([JSON.stringify(backup)],{type:'application/json'}),a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download='여행대백과_백업_'+new Date().toISOString().slice(0,10)+'_'+ids.length+'개국.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);msg('백업 파일을 만들었습니다.')}catch(err){msg('백업 실패: '+err.message)}}
document.getElementById('backupUpload').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{let b=JSON.parse(await f.text());if(b.format!=='world-travel-master-backup'||b.schema!==1||!Array.isArray(b.countries)||!b.images||typeof b.images!=='object')throw Error('지원하지 않는 백업 형식');if(!b.countries.every(c=>typeof c.id==='string'&&Array.isArray(c.sights)&&c.sights.every(s=>Array.isArray(s.photos)&&s.photos.every(p=>typeof p.key==='string'))))throw Error('백업 데이터 구조 오류');let names=b.countries.map(c=>c.name).join(', ');if(!confirm(`${names} 자료를 현재 앱의 자료와 합칩니다. 기존 사진과 여행 기록은 지우지 않습니다. 계속할까요?`))return;
// Validate every referenced image before changing any saved data.
for(let c of b.countries)for(let s of c.sights)for(let p of s.photos){if(typeof b.images[p.key]!=='string'||!b.images[p.key].startsWith('data:image/'))throw Error('사진 데이터 누락 또는 오류')}
let merged=JSON.parse(JSON.stringify(data));let imageWrites=[];let addedCountries=0,addedSights=0,addedPhotos=0;
for(let incoming of b.countries){let current=merged.countries.find(c=>c.id===incoming.id);if(!current){current=JSON.parse(JSON.stringify(incoming));current.sights=[];merged.countries.push(current);addedCountries++}else{for(let field of ['name','capital','emoji','intro','fromKorea'])if(incoming[field]!==undefined&&incoming[field]!=='' )current[field]=incoming[field]}
for(let sourceSight of incoming.sights){let target=current.sights.find(s=>s.id===sourceSight.id);if(!target){target={...sourceSight,photos:[],memo:''};current.sights.push(target);addedSights++}else{for(let field of ['name','city','summary','story','route','tip','emoji'])if(sourceSight[field]!==undefined&&sourceSight[field]!=='')target[field]=sourceSight[field]}
let oldMemo=(target.memo||'').trim(),newMemo=(sourceSight.memo||'').trim();if(newMemo&&!oldMemo)target.memo=newMemo;else if(newMemo&&oldMemo&&!oldMemo.includes(newMemo))target.memo=oldMemo+'\n\n[사파리에서 가져온 기록]\n'+newMemo;
for(let photo of sourceSight.photos){let identity=photo.originKey||photo.key;if(target.photos.some(p=>(p.originKey||p.key)===identity))continue;if(target.photos.length>=10)continue;let newKey='p_'+uid()+'_'+Date.now().toString(36);imageWrites.push([newKey,b.images[photo.key]]);target.photos.push({...photo,key:newKey,originKey:identity});addedPhotos++}
}}
// Photos are written before metadata to avoid references to missing photos.
for(let [key,value] of imageWrites)await imgSet(key,value);let previous=data;try{data=merged;save()}catch(err){data=previous;throw err}go('home');alert(`자료 합치기가 완료되었습니다.\n추가 나라 ${addedCountries}개 · 추가 명소 ${addedSights}개 · 추가 사진 ${addedPhotos}장\n기존 여행 기록은 유지했습니다.`)}catch(err){alert('복원 실패: '+err.message)}finally{e.target.value=''}};
async function resetAll(){if(!confirm('모든 여행 나라, 기록, 저장한 사진을 초기화할까요? 이 작업은 되돌릴 수 없습니다.'))return;if(!confirm('정말 초기화하시겠습니까? 먼저 백업했는지 확인해 주세요.'))return;try{for(let c of data.countries)for(let s of c.sights)for(let p of s.photos)await imgDel(p.key);data=initial();save();go('home');msg('초기화했습니다.')}catch(e){msg('초기화 오류: '+e.message)}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
