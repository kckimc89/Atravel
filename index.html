<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#113e55"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="여행대백과"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><title>세계 여행대백과 MASTER V2.0</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;color:#193d50;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:5;background:#123e55;color:#fff;padding:14px 16px;box-shadow:0 2px 15px #10293322}.head{max-width:1050px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.head strong{font-size:20px}.head small{display:block;color:#bbdce4;font-size:11px}main{max-width:1050px;margin:0 auto;padding:16px 13px 90px}button,input,textarea,select{font:inherit}button{background:#146b84;border:0;color:white;padding:10px 15px;font-weight:750;border-radius:12px;cursor:pointer}button:disabled{opacity:.5}.light{background:#e9f3f5;color:#20566a}.danger{background:#bd4351}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.box{background:white;border-radius:17px;border:1px solid #dbe9ed;padding:17px;margin:13px 0;box-shadow:0 2px 11px #1232}.muted{color:#65808c;font-size:13px}.lead{line-height:1.78}.hero{background:linear-gradient(130deg,#0d435e,#15918d);color:white;padding:26px 21px;border-radius:20px}.hero h1{margin:5px 0;font-size:28px}.hero p{line-height:1.7;color:#e0f3ed}.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px}.place{border:1px solid #c7e0d1;background:#e6f5eb;color:#16553c;text-align:left;padding:12px 14px;border-radius:12px;min-height:69px}.place b{font-size:17px;display:block}.place small{color:#4a7061;display:block;margin-top:5px}.place.unready{background:#fff5f1;border-color:#efd8ce;color:#76574d}.tabbar{display:flex;gap:8px;overflow:auto;padding:4px 0 8px}.tabbar button{white-space:nowrap;background:#e6eff2;color:#385c6c}.tabbar button.active{background:#146b84;color:#fff}.galleryMain{position:relative;border-radius:15px;overflow:hidden;background:#e3ecee;min-height:200px;display:flex;align-items:center;justify-content:center}.galleryMain img{width:100%;height:min(58vw,490px);object-fit:contain;background:#152f3a}.arrow{position:absolute;top:45%;background:#163d58cc;font-size:26px;padding:8px 14px}.left{left:6px}.right{right:6px}.counter{position:absolute;bottom:8px;right:10px;background:#142e3bd9;color:white;border-radius:40px;padding:6px 10px}.thumbs{display:flex;gap:7px;overflow:auto;padding:12px 0}.thumbs button{padding:0;border:3px solid transparent;min-width:84px;height:72px;overflow:hidden;background:#ecf2f4}.thumbs button.active{border-color:#edaa52}.thumbs img{width:100%;height:100%;object-fit:cover}.photoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:9px}.tile{position:relative;background:#f0f5f5;border-radius:10px;overflow:hidden;min-height:125px}.tile img{display:block;width:100%;height:120px;object-fit:cover}.tile button{width:100%;border-radius:0;padding:8px;font-size:12px}.small{font-size:12px}.notice{background:#fff7e8;padding:13px;border-radius:11px;line-height:1.6;color:#806038}.sep{border:0;border-top:1px solid #e2ecee;margin:16px 0}input,textarea{border:1px solid #bed4db;border-radius:10px;padding:12px;width:100%;background:#fff}textarea{min-height:115px}a{color:#146b84;word-break:break-word}.route{border-left:4px solid #239c96;padding:12px 14px;background:#eef8f6;border-radius:8px;line-height:1.7}.cardtitle{font-size:21px;margin:0 0 12px}.chip{border-radius:30px;background:#edf4f6;padding:6px 11px;font-size:13px;color:#376477}#status{font-size:12px;color:#d8f4da}.hide{display:none!important}@media(max-width:500px){.places{grid-template-columns:1fr 1fr}.place{padding:10px}.place b{font-size:15px}.head strong{font-size:17px}}
</style></head><body><header><div class="head"><div><strong>🌏 세계 여행대백과</strong><small>MASTER V2.0 · 실제 사진·검색기억 계승판</small></div><div class="row"><span id="status"></span><button class="light" onclick="settings()">⚙️ 관리</button></div></div></header><main id="app"><div class="box">대한민국 자료를 불러오는 중입니다…</div></main><script>
const VERSION='2.0',KEY='worldtravel_master_v2_user';let data=null,view='home',active=null,tab='info',idx=0,showAll=false,query='',overrides={},custom=[],candidates={},photosOverride={};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};function byid(id){return [...(data?.places||[]),...custom].find(x=>x.id===id)};function getPhotos(p){return photosOverride[p.id]||p.photos||[]};function album(p){return getPhotos(p).slice(0,10)};function memory(p){return getPhotos(p).slice(10)};function save(){try{localStorage.setItem(KEY,JSON.stringify({overrides,custom,candidates,photosOverride}))}catch(e){alert('저장 용량 초과: 큰 사진은 링크로 등록하고 백업을 진행하세요.')}}
function load(){try{let s=JSON.parse(localStorage.getItem(KEY)||'{}');overrides=s.overrides||{};custom=s.custom||[];candidates=s.candidates||{};photosOverride=s.photosOverride||{}}catch(e){}}
function navigate(which,id){view=which;active=id||null;idx=0;tab='info';render();scrollTo(0,0)}
function render(){let el=document.getElementById('app');if(!data)return;el.innerHTML=view==='home'?home():view==='place'?place():view==='settings'?manager():home()}
function home(){const a=[...data.places,...custom].filter(p=>(showAll||p.green)&&(!query||p.name.includes(query)||p.region?.includes(query)));return `<section class="hero"><h1>🇰🇷 대한민국 여행</h1><p>기존 명소대백과 백업에서 명소 36곳과 실제 사진 833장, 설명·사진 출처를 가져왔습니다. 사진첩 10장과 남은 검색기억을 살펴보고 여행 경로도 탐험해 보세요.</p><div class="row"><span class="chip">🏞️ 명소 ${data.places.length}곳</span><span class="chip">📷 원본 사진 ${data.photoCount}장</span><span class="chip">🔎 후보 사진 보존</span></div></section><section class="box"><h2 class="cardtitle">🇰🇷 대한민국 · 명소 선택</h2><div class="row"><input style="flex:1;min-width:150px" placeholder="명소 또는 지역 검색" value="${esc(query)}" oninput="query=this.value;render()"><button class="light" onclick="showAll=!showAll;render()">${showAll?'사진 있는 명소만':'전체 명소 보기'}</button></div><p class="muted">기본 목록은 초록색 이름표 34곳입니다. 전체 보기를 누르면 보류 2곳도 확인할 수 있습니다. 기존 사진은 앱에 포함되어 있으며, 새 사진은 검색하거나 추가할 수 있습니다.</p><div class="places">${a.map(p=>`<button class="place ${getPhotos(p).length?'':'unready'}" onclick="navigate('place','${esc(p.id)}')"><b>${esc(p.name)}</b><small>📍 ${esc(p.region||'지역 미입력')} · 📷 ${getPhotos(p).length}장</small></button>`).join('')}</div></section><section class="box"><h3>➕ 내가 가보고 싶은 명소 추가</h3><div class="row"><input id="newName" style="flex:2;min-width:120px" placeholder="명소 이름"><input id="newRegion" style="flex:1;min-width:100px" placeholder="지역"><button onclick="addPlace()">추가</button></div></section>`}
function place(){const p=byid(active);if(!p)return home();const ps=getPhotos(p);return `<div class="row"><button class="light" onclick="navigate('home')">← 대한민국 명소</button><span class="chip">📍 ${esc(p.region||'대한민국')}</span><span class="chip">📷 ${ps.length}장</span></div><h2 style="font-size:27px">${esc(p.name)}</h2><div class="tabbar">${[['info','📖 설명카드'],['gallery','🖼️ 기본사진첩'],['journey','🧭 여행하기'],['search','🔎 검색기억 · 자동보강']].map(([t,n])=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';idx=0;render()">${n}</button>`).join('')}</div>${tab==='info'?info(p):tab==='gallery'?gallery(p):tab==='journey'?journey(p):searchPanel(p)}`}
function info(p){return `<div class="box"><h3 class="cardtitle">${esc(p.name)}은 어떤 곳일까요?</h3><p class="lead">${esc(overrides[p.id]?.description||p.description||'설명을 추가해 주세요.')}</p><p class="muted">기존 명소대백과 설명을 계승했습니다. 최신 운영시간·요금 등은 방문 전에 확인해 주세요.</p><details><summary>✏️ 설명 수정</summary><textarea id="description">${esc(overrides[p.id]?.description||p.description)}</textarea><button onclick="editDescription()">설명 저장</button></details></div>${album(p)[0]?`<div class="box"><img style="width:100%;max-height:460px;object-fit:contain" src="${esc(album(p)[0].src)}" alt="${esc(p.name)}"><p class="muted">사진: ${esc(album(p)[0].artist||'출처 정보 참조')} · ${esc(album(p)[0].license||'')}</p><button onclick="tab='gallery';render()">사진첩 보기 →</button></div>`:''}`}
function gallery(p){let a=album(p);idx=Math.min(idx,Math.max(a.length-1,0));if(!a.length)return `<div class="box">저장된 사진이 없습니다. 검색기억 탭에서 추가할 수 있습니다.</div>`;let x=a[idx];return `<div class="box"><h3 class="cardtitle">🖼️ 기본사진첩 · ${a.length}장</h3><div class="galleryMain"><img src="${esc(x.src)}" alt="${esc(p.name)} 사진"><button class="arrow left" onclick="shift(-1)">‹</button><button class="arrow right" onclick="shift(1)">›</button><span class="counter">${idx+1} / ${a.length}</span></div><div class="thumbs">${a.map((ph,i)=>`<button class="${idx===i?'active':''}" onclick="idx=${i};render()"><img loading="lazy" src="${esc(ph.src)}"></button>`).join('')}</div><p><strong>${esc(x.title?.replace(/^File:/,'')||p.name)}</strong></p><p class="muted">촬영/제공: ${esc(x.artist||'미상')} · 라이선스: ${esc(x.license||'확인 필요')} ${x.source?`· <a href="${esc(x.source)}" target="_blank" rel="noopener">원본 및 이용조건</a>`:''}</p><div class="row"><button onclick="autoSlide()">▶ 슬라이드 ${timer?'중지':'시작'}</button><button class="light" onclick="tab='search';render()">다른 사진 ${memory(p).length}장 보기</button></div></div>`}
let timer=null;function stopSlide(){if(timer){clearInterval(timer);timer=null}}function shift(d){let a=album(byid(active));idx=(idx+d+a.length)%a.length;render()};function autoSlide(){if(timer){stopSlide();render();return}timer=setInterval(()=>{if(view!=='place'||tab!=='gallery'){stopSlide();return}shift(1)},3200);render()}
const hints={'서울':['서울 지하철·시내버스','약 20~70분'],'경기':['수도권 전철·버스','약 40~120분'],'인천':['공항철도·지하철·버스','약 60~110분'],'경주':['서울역 → 신경주역(KTX) → 시내버스/택시','약 3~4시간'],'부산':['서울역 → 부산역(KTX) → 도시철도/버스','약 3~4시간'],'제주':['김포공항 → 제주공항(항공) → 버스/렌터카','약 2~4시간'],'전주':['서울 → 전주(KTX/고속버스) → 지역교통','약 2~3시간'],'공주':['서울 → 공주(KTX/버스) → 지역교통','약 2~3시간'],'안동':['청량리역 → 안동역(KTX-이음) → 버스/택시','약 3~4시간'],'강원':['서울 → 강원권(기차/버스) → 지역교통','약 2~5시간'],'순천':['용산역 → 순천역(KTX) → 버스','약 3~4시간'],'담양':['서울 → 광주(열차) → 담양(버스)','약 3~4시간'],'영주':['청량리역 → 영주역 → 버스/택시','약 2.5~4시간'],'부안':['서울 → 부안(고속버스) → 지역교통','약 3~4시간'],'고창':['서울 → 고창(고속버스) → 지역교통','약 3.5~5시간']};function route(p){let r=p.region||'';let found=Object.keys(hints).find(k=>r.includes(k))||Object.keys(hints).find(k=>p.name.includes(k));return hints[found]||['서울에서 기차·버스·항공편으로 가까운 도시 이동 후 지역교통 이용','지역 및 교통편에 따라 다름']}
function journey(p){let [way,time]=route(p);let note=overrides[p.id]?.note||'';return `<div class="box"><h3 class="cardtitle">🧭 ${esc(p.name)} 여행하기</h3><p>🇰🇷 <b>출발 기준: 수도 서울</b></p><div class="route"><strong>서울 출발 → ${esc(p.region||'해당 지역')} → ${esc(p.name)}</strong><br>🚆 이동 예시: ${esc(way)}<br>⏱️ 예상 총 이동시간: ${esc(time)}</div><p class="notice">이동 경로와 시간은 이해를 돕는 대략적인 예시입니다. 실시간 교통·운행 여부를 확인한 결과는 아니므로 여행 전 실제 길찾기로 확인하세요.</p><div class="row"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+' '+p.region)}" target="_blank" rel="noopener"><button>🗺️ 지도에서 명소 찾기</button></a><a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent('서울역')}&destination=${encodeURIComponent(p.name+' '+p.region)}&travelmode=transit" target="_blank" rel="noopener"><button class="light">🚉 서울에서 길찾기</button></a></div><hr class="sep"><h3>✍️ 나의 여행 기록</h3><textarea id="note" placeholder="다녀온 날, 재미있던 일, 다시 가고 싶은 이유 등을 적어 보세요.">${esc(note)}</textarea><button onclick="saveNote()">기록 저장</button></div>`}
function searchPanel(p){let mem=memory(p),a=album(p),found=candidates[p.id]||[];return `<div class="box"><h3 class="cardtitle">🔎 기존 사진 검색기억</h3><p class="muted">원본 백업에 있던 사진을 순서대로 보존했습니다. 앞의 10장은 기본사진첩, 나머지 ${mem.length}장은 후보 사진으로 사용할 수 있습니다. 기존 백업의 별도 검색기억 배열은 비어 있었지만 사진과 출처 정보는 모두 계승했습니다.</p><div class="row"><button onclick="wikiSearch()">🌐 실제 사진 자동검색</button><button class="light" onclick="wikiDescription()">📖 설명 자동보강 후보</button></div><p id="searchStatus" class="muted"></p></div><div class="box"><h3>저장된 사진 후보 ${mem.length}장</h3><div class="photoGrid">${mem.map((x,i)=>`<div class="tile"><img loading="lazy" src="${esc(x.src)}" alt="${esc(x.title)}"><button onclick="promote(${i+10})">사진첩에 넣기 ↗</button></div>`).join('')}</div></div>${found.length?`<div class="box"><h3>🌐 온라인 검색 결과 ${found.length}장</h3><div class="photoGrid">${found.map((x,i)=>`<div class="tile"><img loading="lazy" src="${esc(x.src)}"><button onclick="addCandidate(${i})">이 사진 추가</button></div>`).join('')}</div><p class="muted">새 사진은 외부 링크로 저장됩니다. 오프라인 사용을 원하면 사진 파일로 별도 등록해야 합니다. 반드시 출처와 이용조건을 확인하세요.</p></div>`:''}<div class="box"><h3>📸 새 사진 링크 등록</h3><input id="photoUrl" placeholder="https://... 이미지 주소"><button onclick="addUrl()" style="margin-top:8px">사진 추가</button></div>`}
function promote(i){let p=byid(active),a=[...getPhotos(p)];let x=a.splice(i,1)[0];a.unshift(x);photosOverride[p.id]=a;save();render();alert('기본사진첩의 첫 사진으로 옮겼습니다.')}
function addCandidate(i){let p=byid(active),x=(candidates[p.id]||[])[i];if(!x)return;photosOverride[p.id]=[...getPhotos(p),x];save();render()}
function addUrl(){let v=document.getElementById('photoUrl').value.trim();if(!/^https:\/\//i.test(v))return alert('https 사진 주소를 입력하세요.');let p=byid(active);photosOverride[p.id]=[...getPhotos(p),{id:'user'+Date.now(),src:v,title:'직접 등록 사진',artist:'사용자 등록',source:v}];save();render()}
async function wikiSearch(){let p=byid(active),status=document.getElementById('searchStatus');status.textContent='위키미디어 공용에서 사진을 검색하고 있습니다…';try{let url='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('filetype:bitmap '+(p.aliases?.[0]||p.name))+'&gsrnamespace=6&gsrlimit=18&prop=imageinfo&iiprop=url%7Cextmetadata&iiurlwidth=700&format=json&origin=*';let r=await fetch(url);if(!r.ok)throw Error(r.status);let j=await r.json();let pp=Object.values(j.query?.pages||{});candidates[p.id]=pp.filter(x=>x.imageinfo?.[0]?.thumburl).map(x=>({id:'web'+x.pageid,src:x.imageinfo[0].thumburl,title:x.title,source:x.imageinfo[0].descriptionurl,artist:(x.imageinfo[0].extmetadata?.Artist?.value||'').replace(/<[^>]*>/g,''),license:(x.imageinfo[0].extmetadata?.LicenseShortName?.value||'확인 필요')}));save();render()}catch(e){status.textContent='검색 실패: 인터넷 연결 또는 위키미디어 응답을 확인하세요. '+e.message}}
async function wikiDescription(){let p=byid(active),status=document.getElementById('searchStatus');status.textContent='위키백과 설명을 조회 중입니다…';try{let q=await fetch('https://ko.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(p.name)+'&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&format=json&origin=*');if(!q.ok)throw Error(q.status);let j=await q.json(),x=Object.values(j.query?.pages||{})[0];if(!x?.extract)throw Error('설명 없음');let d=x.extract.slice(0,2600);if(confirm('검색 후보: '+x.title+'\n\n'+d.slice(0,450)+'\n\n현재 설명을 이 내용으로 바꾸시겠습니까?')){overrides[p.id]={...(overrides[p.id]||{}),description:d};save();tab='info';render()}else status.textContent='기존 설명을 유지했습니다.'}catch(e){status.textContent='설명 검색에 실패했습니다: '+e.message}}
function editDescription(){let d=document.getElementById('description').value;overrides[active]={...(overrides[active]||{}),description:d};save();render();alert('설명을 저장했습니다.')};function saveNote(){overrides[active]={...(overrides[active]||{}),note:document.getElementById('note').value};save();alert('여행 기록을 저장했습니다.')};function addPlace(){let n=document.getElementById('newName').value.trim(),r=document.getElementById('newRegion').value.trim();if(!n)return alert('명소 이름을 입력하세요.');custom.push({id:'mine'+Date.now(),name:n,region:r,description:'',photos:[]});save();render()}
function settings(){view='settings';render();scrollTo(0,0)}function manager(){return `<button class="light" onclick="navigate('home')">← 명소 목록</button><div class="box"><h2>⚙️ 앱 관리 · MASTER V2.0</h2><p class="lead">원본 명소대백과 백업은 변경하지 않습니다. 이 앱에는 사진 833장과 출처 기록이 포함되어 있습니다. 변경한 설명, 여행 기록과 사진 배치는 이 브라우저의 저장공간에 별도 저장됩니다.</p><div class="row"><button onclick="exportBackup()">⬇️ 나의 변경사항 백업</button><label class="chip">📁 백업 복원 <input style="width:170px" type="file" accept=".json" onchange="importBackup(event)"></label><button class="light" onclick="location.reload()">🔄 최신 화면 불러오기</button></div><p class="muted">GitHub의 새 버전 배포는 GitHub에서 전체 파일을 올려야 합니다. 앱 버튼으로 GitHub 파일 업로드까지 자동 수행하지는 않습니다. Safari와 홈 화면 앱의 저장공간이 다를 수 있으므로 백업·복원으로 변경사항을 옮기세요.</p></div><div class="box"><h3>자료 및 출처</h3><p>대한민국 명소대백과 2026-10-18 05:24 백업에서 사진 833장과 원본 사진 저작자·라이선스·출처를 가져왔습니다. 사진들은 앱 전송 용량을 줄이기 위해 화면용으로 축소했습니다.</p><p class="muted">원본의 별도 검색기억 항목은 0개였으므로 사진 중 기본사진첩을 제외한 사진을 보존 후보로 보여줍니다. 원본 고해상도는 기존 백업에 남아 있습니다.</p></div>`}
function exportBackup(){let x={format:'worldtravel-v2-user',version:VERSION,exported:new Date().toISOString(),overrides,custom,candidates,photosOverride};let b=new Blob([JSON.stringify(x)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='세계여행대백과_변경사항_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}async function importBackup(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(x.format!=='worldtravel-v2-user')throw Error('이 앱의 변경사항 백업이 아닙니다.');if(!confirm('현재의 변경사항에 백업 내용을 합치시겠습니까?'))return;overrides={...overrides,...(x.overrides||{})};custom=[...custom,...(x.custom||[]).filter(v=>!custom.some(p=>p.id===v.id))];candidates={...candidates,...(x.candidates||{})};photosOverride={...photosOverride,...(x.photosOverride||{})};save();render();alert('변경사항 복원 완료')}catch(err){alert('복원 실패: '+err.message)}}
(async()=>{load();try{let r=await fetch('catalog.json');if(!r.ok)throw Error(r.status);data=await r.json();document.getElementById('status').textContent='사진 '+data.photoCount+'장';render()}catch(e){document.getElementById('app').innerHTML='<div class="box">자료 로딩 실패: catalog.json과 photos 폴더를 ZIP에서 함께 업로드했는지 확인해주세요. '+esc(e.message)+'</div>'}})();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
